name: Website

on:
  push:
    branches: [main, docs]
    paths: ['www/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install
        working-directory: www
        run: bun install --frozen-lockfile
      - name: Validate links
        working-directory: www
        run: bun run validate
      - name: Build
        working-directory: www
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build
      - name: Audit output
        working-directory: www
        run: bun run audit
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
