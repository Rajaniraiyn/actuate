name: Native packages
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      ACTUATE_SKIP_DOWNLOAD: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise run setup
      - name: Build release artifacts
        run: mise run release:build
      - name: Test bindings and Rust contracts
        run: mise run test
      - name: Build Python wheel
        run: mise run release:wheel
      - name: CLI smoke check
        shell: bash
        run: |
          ./target/release/actuate --help
          ./target/release/actuate overlay --help
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
  packages:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          merge-multiple: true
          path: target/release-assets
      - uses: jdx/mise-action@v4
      - run: mise run setup
      - run: mise run release:typescript release:sdist
      - run: mise run release:manifest
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: target/release-assets/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" assets/* --verify-tag --generate-notes --title "Actuate $RELEASE_TAG"
