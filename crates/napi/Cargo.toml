[package]
name = "actuate-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["cdylib"]
[features]
default = ["android", "apple-device"]
android = ["actuate-bindings/android"]
apple-device = ["actuate-bindings/apple-device"]
[dependencies]
actuate-bindings = { path = "../bindings", default-features = false }
napi = { version = "3.12.6", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json.workspace = true
[build-dependencies]
napi-build = "2"
