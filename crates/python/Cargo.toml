[package]
name = "actuate-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lib]
name = "_native"
crate-type = ["cdylib"]
[features]
default = ["android", "apple-device"]
android = ["actuate-bindings/android"]
apple-device = ["actuate-bindings/apple-device"]
[dependencies]
actuate-bindings = { path = "../bindings", default-features = false }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
serde_json.workspace = true
[build-dependencies]
pyo3-build-config = "0.29.2"
