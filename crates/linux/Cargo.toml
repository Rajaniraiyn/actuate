[package]
publish = false
name = "linux"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
unimation.workspace = true
overlay.workspace = true
serde.workspace = true
serde_json.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
compositor = { path = "../compositor" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["xtest", "randr", "xfixes", "shape", "composite", "xinput", "render"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
zvariant = "5"
async-io = "2"
futures-lite = "2"
png = "0.18"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs"] }
