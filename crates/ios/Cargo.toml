[package]
publish = false
name = "ios"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
unimation.workspace = true
serde.workspace = true
serde_json.workspace = true
usage = { workspace = true, optional = true }
idevice = { version = "=0.1.68", default-features = false, features = ["usbmuxd", "screenshotr", "ring"], optional = true }
tokio = { version = "1", features = ["rt", "time", "net"], optional = true }
imagesize = { version = "0.14", optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSUUID"] }
objc2-core-foundation = "0.3.2"
block2 = "0.6.2"

[features]
physical = ["dep:idevice", "dep:tokio", "dep:imagesize"]
cli = ["dep:usage"]

[[bin]]
name = "unimation-ios"
path = "src/bin/unimation-ios.rs"
required-features = ["cli"]
