[build-system]
requires = ["packaging>=24", "tomli>=2; python_version < '3.11'"]
build-backend = "actuate_build"
backend-path = ["."]

[project]
name = "actuate"
version = "0.1.0"
description = "Native UI automation for apps, windows, and desktops"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
readme = "README.md"

[project.urls]
Homepage = "https://rajaniraiyn.dev/actuate/"
Repository = "https://github.com/Rajaniraiyn/actuate"

[tool.maturin]
manifest-path = "../../crates/python/Cargo.toml"
python-source = "."
module-name = "actuate._native"

[dependency-groups]
dev = ["maturin==1.14.1", "packaging==26.3", "mypy==1.20.2"]
