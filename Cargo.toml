[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unimation = { path = "crates/unimation" }
macos = { path = "crates/macos" }
ios = { path = "crates/ios" }
usage = { package = "usage-rs", version = "6.9.1", default-features = false, features = ["help", "diagnostics", "completions"] }
overlay = { path = "crates/overlay" }
