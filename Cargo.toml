[workspace]
members = ["crates/*"]
exclude = ["vendor/patches/droidmux-pairing", "vendor/patches/droidmux-shell", "vendor/patches/droidmux-client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rajaniraiyn/actuate"
homepage = "https://rajaniraiyn.dev/actuate/"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
actuate = { path = "crates/actuate" }
macos = { path = "crates/macos" }
ios = { path = "crates/ios" }
usage = { package = "usage-rs", version = "6.9.1", default-features = false, features = ["help", "diagnostics", "completions"] }
overlay = { path = "crates/overlay" }
linux = { path = "crates/linux" }

[patch."https://github.com/poapoauu/DroidMux"]
droidmux-pairing = { path = "vendor/patches/droidmux-pairing" }
droidmux-shell = { path = "vendor/patches/droidmux-shell" }
droidmux-client = { path = "vendor/patches/droidmux-client" }
